</style></head><body><div id="root"><div class="startup-card"><h1>Caring Jordan</h1><p>19–24 November 2026</p></div></div>

<dialog id="caring-city-dialog" lang="en" dir="ltr" aria-labelledby="caring-city-title" aria-describedby="caring-city-description">
 <h2 id="caring-city-title">Welcome to the Caring Scientific Symposium in Jordan 🇯🇴</h2>
 <p id="caring-city-description">Choose your departure city to view your programme.</p>
 <div class="caring-city-actions">
  <button type="button" data-caring-city="benghazi">Benghazi</button>
  <button type="button" data-caring-city="tripoli">Tripoli</button>
 </div>
 <button type="button" id="caring-city-cancel" hidden>Cancel</button>
</dialog>
<script>
const cityStorageKey = 'caring-jordan-city';
const knownCity = city => city === 'tripoli' || city === 'benghazi';
function readCaringCity() {
  const urlCity = new URL(location.href).searchParams.get('caring-city');
  if (knownCity(urlCity)) return urlCity;
  try { return localStorage.getItem(cityStorageKey); } catch { return null; }
}
window.caringCity = readCaringCity();
const cityDialog = document.getElementById('caring-city-dialog');
const cancelCity = document.getElementById('caring-city-cancel');
window.chooseCaringCity = () => {
  cancelCity.hidden = !knownCity(window.caringCity);
  for (const button of cityDialog.querySelectorAll('[data-caring-city]')) {
    button.setAttribute('aria-pressed', String(button.dataset.caringCity === window.caringCity));
  }
  cityDialog.showModal();
};
cancelCity.addEventListener('click', () => cityDialog.close());
cityDialog.addEventListener('cancel', event => {
  if (!knownCity(window.caringCity)) event.preventDefault();
});
const cityReady = new Promise(resolve => {
  if (knownCity(window.caringCity)) resolve();
  else window.chooseCaringCity();
  for (const button of cityDialog.querySelectorAll('[data-caring-city]')) {
    button.addEventListener('click', () => {
      const city = button.dataset.caringCity;
      const previous = window.caringCity;
      window.caringCity = city;
      const url = new URL(location.href);
      try {
        localStorage.setItem(cityStorageKey, city);
        url.searchParams.delete('caring-city');
      } catch {
        url.searchParams.set('caring-city', city);
      }
      history.replaceState(history.state, '', url);
      cityDialog.close();
      if (knownCity(previous) && previous !== city) location.reload();
      else resolve();
    });
  }
});
</script>

<script>
async function restore(id) {
  const source = document.getElementById(id).textContent.replace(/\s/g, '');
  const bytes = Uint8Array.from(atob(source), character => character.charCodeAt(0));
  return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
Promise.all([restore('site-design'), restore('site-application'), cityReady]).then(([css, source]) => {
  const style = document.createElement('style');
  style.textContent = css;
  document.head.append(style);
  const script = document.createElement('script');
  script.textContent = source;
  document.body.append(script);
}).catch(() => {
  document.getElementById('root').textContent = 'The event guide could not load. Please refresh the page.';
});
